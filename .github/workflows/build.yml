name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone and car APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :phone:assembleRelease :car:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/release/*.apk out/DaBYDlink-phone.apk
          cp car/build/outputs/apk/release/*.apk out/DaBYDlink-car.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DaBYDlink-apks
          path: out/*.apk
