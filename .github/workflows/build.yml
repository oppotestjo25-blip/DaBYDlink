name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone and car APKs
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon :phone:assembleRelease :car:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp phone/build/outputs/apk/release/*.apk out/DaBYDlink-phone.apk
          cp car/build/outputs/apk/release/*.apk out/DaBYDlink-car.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DaBYDlink-apks
          path: out/*.apk

      - name: Publish APKs as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/DaBYDlink-phone.apk out/DaBYDlink-car.apk \
            --title "DaBYDlink $TAG" \
            --notes "Install DaBYDlink-phone.apk on your phone and DaBYDlink-car.apk on the BYD screen." \
            --latest
